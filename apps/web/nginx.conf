server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA: unknown paths fall back to index.html so react-router owns client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
