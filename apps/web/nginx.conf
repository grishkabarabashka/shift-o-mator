server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is ~730 KB of JS and ~60 KB of CSS uncompressed, fetched on every cold
    # load by ~80 people on a corporate WAN. gzip takes that to roughly a quarter, and
    # nothing else in the deployment compresses it: the AKS LoadBalancer is layer 4 and
    # the Application Gateway does not compress by default.
    gzip on;
    gzip_vary on;                # so a cache never hands a gzipped body to a client that did not ask
    gzip_min_length 1024;        # below this the header costs more than the saving
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Headers that are safe to set unconditionally. Deliberately NOT a Content-Security-
    # Policy: `connect-src` would have to name the API origin, and that origin is a build
    # arg (VITE_API_URL) unknown to this file — behind an ingress it is the page's own
    # origin, in the sandbox it is a LoadBalancer IP. A CSP guessed wrong here breaks
    # sign-in rather than failing loudly, so it belongs with a templated config once the
    # deployment has one real origin. `frame-ancestors` is the piece a CSP would add over
    # X-Frame-Options; the rest is covered below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /health {
        default_type text/plain;   # not add_header: Content-Type is set by default_type, and add_header would append a second one
        return 200 "ok";
    }

    # SPA: unknown paths fall back to index.html so react-router owns client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html names this build's hashed asset files. Served with no cache directive
        # a browser is free to reuse it heuristically, and after a redeploy that means a
        # cached shell asking for assets the new image no longer contains — a blank page
        # that a hard reload fixes and nothing else does. `no-cache` still revalidates
        # cheaply (304), it does not mean "do not store".
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header does not inherit into a location that sets one of its own, so the
        # four security headers above have to be repeated here or hashed asset responses
        # would go out without them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
