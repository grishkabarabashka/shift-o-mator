# Throwaway test environment — 1-node AKS, Azure SQL Serverless free-tier, SQL reached by
# managed identity, and the AKS managed NGINX ingress in front of both pods. Provision per
# deploy/README.md section 5; tear down with `az group delete --name <rg> --yes --no-wait`.
#
# There is no Key Vault here at all: SQL and the model are both reached by managed
# identity, so nothing is secret — the connection string carries no password, and the JWT
# authority/audience are a public URL and a public app id URI. Switch it on only for a SQL
# password or a key-authenticated model endpoint.
#
# The ingress is not a luxury borrowed from production: this environment exists to test a
# real Entra ID sign-in, and a browser cannot do one against a plain-HTTP address. Entra
# refuses a non-HTTPS redirect URI (only `http://localhost` is exempt) and MSAL has no
# `crypto.subtle` outside a secure context, so PKCE fails before a request is ever sent.
# `<ingress-ip>.nip.io` plus a self-signed certificate is what makes that origin exist
# without a domain to register — see deploy/README.md section 7.
#
# NOT for anything resembling production: one node, a self-signed certificate, a database
# on the free-tier quota that auto-pauses.

image:
  registry: "ghcr.io/grishkabarabashka"   # ghcr.io/<github-owner> — required, see deploy/README.md section 4
  pullSecrets:
    - name: ghcr-pull-secret   # created once per cluster, deploy/README.md section 4

replicaCount:
  api: 1
  web: 1

api:
  # Production, not Development, even though this is a throwaway environment. `Development`
  # is what gates `MapOpenApi` and Scalar in Program.cs — publishing a browsable, "Try it"
  # API reference on a public address is a bigger exposure than the environment is worth.
  # It also means appsettings.Production.json is the file that applies, which is the one
  # the settings here are written against. Read the OpenAPI document from a local run.
  env: Production
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 300m, memory: 384Mi }
  config:
    # Stub is local-only. The sandbox validates real Entra ID tokens and resolves people
    # by email (ADR-0058). The web image must be built with VITE_AUTH_MODE=entra and the
    # matching client id/tenant/scope, or it sends no token and every call is refused.
    authMode: EntraId

    # Empty on purpose. Behind the ingress the app and the API are one origin, so the
    # browser sends no cross-origin request and there is nothing to allow. Add an origin
    # here only if something outside that origin has to call the API.
    corsAllowedOrigins: []

    # Azure OpenAI, the same shape production uses — so the sandbox rehearses the
    # production auth path rather than only its deployment. Left off until the resource
    # exists: `azure-openai` with a blank endpoint fails startup by design, and AI is
    # optional, so it must not take the API down with it. Fill both in, flip the provider,
    # and grant the pod identity `Cognitive Services OpenAI User` — there is no key.
    aiProvider: none
    aiEndpoint: ""      # https://<resource>.openai.azure.com/
    aiModel: ""         # the deployment name, e.g. gpt-4o-mini

    # No password: `Active Directory Default` authenticates as the pod's managed identity,
    # which was granted a database user in section 5.
    #
    # For a database that cannot do Entra auth — a standalone SQL Server on a VM, say —
    # leave this empty and put the password-bearing string in Key Vault instead, as
    # `shift-o-mator-connection-string → ConnectionStrings__ShiftOMator` under
    # `azureKeyVault.secrets`. The Secret is applied after the ConfigMap, so it wins.
    connectionString: "Server=tcp:sql-shiftomator-sandbox.database.windows.net,1433;Initial Catalog=ShiftOMator;Authentication=Active Directory Default;Encrypt=True;"

    jwtAuthority: "https://login.microsoftonline.com/8d073157-f1db-42b2-861d-8f854c3752ba/v2.0"
    jwtAudience: "api://99d89727-d2de-4b09-8932-b19f240aaa9f"

web:
  config:
    # Empty on purpose: behind the ingress the app and the API are the same origin, so a
    # relative /api/... request is the right one and there is no second address to name.
    apiUrl: ""
    authMode: entra
    entraClientId: "99d89727-d2de-4b09-8932-b19f240aaa9f"
    entraTenantId: "8d073157-f1db-42b2-861d-8f854c3752ba"
    entraApiScope: "api://99d89727-d2de-4b09-8932-b19f240aaa9f/access_as_user"
    entraRedirectUri: ""   # empty defaults to the current origin at runtime

ingress:
  enabled: true
  # The AKS application-routing add-on's managed NGINX (`az aks approuting enable`), not
  # the Application Gateway production is written against: no gateway to provision, no
  # subnet to delegate, and it is free beyond the one load balancer it creates.
  className: webapprouting.kubernetes.azure.com   # `kubectl get ingressclass` — NOT the ".io" name
  host: ""            # <ingress-ip>.nip.io — pass with --set, it is not known until the controller has an IP
  tls:
    enabled: true
    secretName: shift-o-mator-tls   # self-signed, created by hand in section 7

azureKeyVault:
  enabled: false      # nothing here is secret; see the header and README section 5

# How the pod authenticates to Azure: SQL, and Key Vault if it is ever switched on above.
# Needed even with no vault.
workloadIdentity:
  enabled: true
  clientId: "2a7d547c-1612-4446-9e2f-a0c75f72a25c"     # from deploy/README.md section 5

serviceAccount:
  create: true
  name: shift-o-mator
