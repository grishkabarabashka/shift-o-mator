{{- if .Values.azureKeyVault.enabled }}
# Azure Key Vault Provider for Secrets Store CSI Driver. The pod mounts this as a
# volume (see api-deployment.yaml), which also syncs the values into a native k8s
# Secret (secretObjects below) so they can be consumed as plain env vars — CSI mount
# alone would require the app to read from files, which it does not.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shift-o-mator-kv
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: shift-o-mator-secrets
      type: Opaque
      data:
        {{- range .Values.azureKeyVault.secrets }}
        - objectName: {{ .objectName }}
          key: {{ .envVarName }}
        {{- end }}
  parameters:
    usePodIdentity: "false"
    {{- if eq .Values.azureKeyVault.authMethod "addonManagedIdentity" }}
    # Sandbox/dev path: no OIDC federation, no per-pod identity. The CSI driver reads
    # Key Vault as the AKS-managed identity created automatically by the
    # `azure-keyvault-secrets-provider` add-on (granted `get`/`list` via
    # `az keyvault set-policy`, deploy/README.md section 5) — an empty
    # userAssignedIdentityID means "use that identity", not a specific one.
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""
    {{- else }}
    # Workload identity: the same pod identity SQL uses (see the top-level
    # `workloadIdentity` block and serviceaccount.yaml), so there is one thing to grant
    # rather than two.
    useVMManagedIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    {{- end }}
    keyvaultName: {{ .Values.azureKeyVault.keyvaultName | quote }}
    tenantId: {{ .Values.azureKeyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.azureKeyVault.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
        {{- end }}
{{- end }}
