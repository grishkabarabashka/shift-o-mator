{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  # Azure AD Workload Identity: this service account is federated with a user-assigned
  # managed identity (az identity federated-credential create --issuer <AKS OIDC issuer>
  # --subject system:serviceaccount:<ns>:<name>), which is how the pod calls Azure — SQL,
  # and Key Vault where configured — with no client secret stored anywhere.
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
{{- end }}
