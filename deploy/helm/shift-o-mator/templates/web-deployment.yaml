apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shift-o-mator.instance" . }}-web
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Without this a `helm upgrade` that changes only web-configmap.yaml (a new API
        # origin, a tenant switch) leaves the pods running the old config.js contents,
        # because nothing in the pod spec itself changed — same reasoning as the API
        # deployment's checksum/config.
        checksum/config: {{ include (print $.Template.BasePath "/web-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "shift-o-mator.labels" . | nindent 8 }}
        {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # This pod serves static files and calls nothing: it needs neither a Kubernetes API
      # token nor an Azure identity. The API's pod is the opposite case and keeps its
      # service account — the workload-identity webhook projects its own token there.
      automountServiceAccountToken: false
      securityContext:
        {{- include "shift-o-mator.podSecurityContext" (dict "uid" .Values.web.runAsUser) | nindent 8 }}
      {{- if gt (int .Values.replicaCount.web) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "web") | nindent 14 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "shift-o-mator.image" (dict "root" $ "repository" .Values.image.web.repository "tag" .Values.image.web.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "shift-o-mator.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "shift-o-mator.instance" . }}-web-config
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shift-o-mator.instance" . }}-web
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type | default "ClusterIP" }}
  selector:
    {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "web") | nindent 4 }}
  ports:
    - port: 80
      targetPort: http
{{- if gt (int .Values.replicaCount.web) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shift-o-mator.instance" . }}-web
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "web") | nindent 6 }}
{{- end }}
