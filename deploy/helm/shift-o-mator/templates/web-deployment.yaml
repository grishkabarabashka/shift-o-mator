# No env vars here: VITE_API_URL is baked into the JS bundle at image build time
# (apps/web/Dockerfile ARG), because Vite inlines import.meta.env.VITE_* at build,
# not at container start. Rebuild-and-push the web image, don't try to override it here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shift-o-mator-web
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "shift-o-mator.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "shift-o-mator.image" (dict "root" $ "repository" .Values.image.web.repository "tag" .Values.image.web.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: shift-o-mator-web
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: http
