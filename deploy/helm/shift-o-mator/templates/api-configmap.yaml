# Non-secret config only. The connection string belongs here when SQL uses managed
# identity (it then carries no password); a password-bearing one, and an AI key if the
# model is reached by key rather than by managed identity, come from the Key Vault-backed
# Secret instead — see secretproviderclass.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shift-o-mator-api-config
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.api.env | quote }}
  {{- if .Values.ingress.enabled }}
  # Behind an ingress that terminates TLS, the request reaches the pod as plain HTTP and
  # `Request.Scheme` is `http` unless X-Forwarded-Proto is honoured. This is ASP.NET Core's
  # own switch for the ForwardedHeaders middleware, so it needs no code — and it is set
  # only with an ingress in front, because trusting those headers with the Service exposed
  # directly (the sandbox's LoadBalancer) would mean trusting whatever the caller sends.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  {{- end }}
  Auth__Mode: {{ .Values.api.config.authMode | quote }}
  Ai__Provider: {{ .Values.api.config.aiProvider | quote }}
  Ai__Model: {{ .Values.api.config.aiModel | quote }}
  {{- with .Values.api.config.aiEndpoint }}
  Ai__Endpoint: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.config.connectionString }}
  ConnectionStrings__ShiftOMator: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.config.jwtAuthority }}
  Auth__Jwt__Authority: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.config.jwtAudience }}
  Auth__Jwt__Audience: {{ . | quote }}
  {{- end }}
  {{- range $i, $origin := .Values.api.config.corsAllowedOrigins }}
  Cors__AllowedOrigins__{{ $i }}: {{ $origin | quote }}
  {{- end }}
