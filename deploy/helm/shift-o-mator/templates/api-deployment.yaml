apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shift-o-mator.instance" . }}-api
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Without this a `helm upgrade` that changes only the ConfigMap — a CORS origin, a
        # connection string, the AI provider — updates the ConfigMap and leaves the pods
        # running the old values, because nothing in the pod spec changed. The checksum
        # makes the config part of the pod spec, so a config change is a rollout.
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "shift-o-mator.labels" . | nindent 8 }}
        {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        # Tells the workload-identity webhook to project a token into this pod. Without
        # it the service account's annotation is inert and `Active Directory Default`
        # falls through to the node's identity, which has no database access.
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- include "shift-o-mator.podSecurityContext" (dict "uid" .Values.api.runAsUser) | nindent 8 }}
      {{- if gt (int .Values.replicaCount.api) 1 }}
      # `ScheduleAnyway`, not `DoNotSchedule`: the sandbox is a one-node cluster, where a
      # hard constraint would leave the second replica Pending forever rather than merely
      # unspread. On a real pool this spreads the replicas across nodes, which is what
      # makes the PodDisruptionBudget below mean anything during a node drain.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "shift-o-mator.image" (dict "root" $ "repository" .Values.image.api.repository "tag" .Values.image.api.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "shift-o-mator.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          # Order matters: on a key present in both, the *later* source wins. The secret is
          # second deliberately, so a Key Vault value always overrides the ConfigMap's —
          # which is what makes "move the connection string into the vault" a change to
          # one values file rather than to two.
          envFrom:
            - configMapRef:
                name: {{ include "shift-o-mator.instance" . }}-api-config
            {{- if .Values.azureKeyVault.enabled }}
            - secretRef:
                name: {{ include "shift-o-mator.instance" . }}-secrets
            {{- end }}
          volumeMounts:
            {{- if .Values.azureKeyVault.enabled }}
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- end }}
          # WHY a startup probe and not just a longer liveness delay: the API runs EF
          # migrations and reference seeding *before* `app.Run()`, so until that finishes
          # the port is not listening at all and every probe is a refused connection. On
          # Azure SQL Serverless the database may additionally be resuming from auto-pause,
          # which alone can take a minute. The old liveness settings gave up after ~75s and
          # killed the pod mid-migration, which reads as CrashLoopBackOff rather than as
          # "the database was cold". Liveness does not start until this one passes.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 60      # up to 5 minutes to migrate, seed and listen
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- if .Values.azureKeyVault.enabled }}
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "shift-o-mator.instance" . }}-kv
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shift-o-mator.instance" . }}-api
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # ClusterIP by default: behind an ingress the API is reached at /api on the same origin
  # as the app, which is the only shape where a browser sign-in works (Entra refuses a
  # non-HTTPS redirect URI, and MSAL needs a secure context for PKCE). `LoadBalancer` is
  # for reaching the API directly without an ingress — a public IP with no TLS, which is a
  # debugging affordance, not a way to serve the app.
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  selector:
    {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    - port: 80
      targetPort: http
{{- if gt (int .Values.replicaCount.api) 1 }}
---
# Only meaningful above one replica: with a single pod, any budget either blocks a node
# drain outright or permits the only pod to go, so the sandbox deliberately gets none.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shift-o-mator.instance" . }}-api
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "shift-o-mator.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
{{- end }}
