apiVersion: apps/v1
kind: Deployment
metadata:
  name: shift-o-mator-api
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "shift-o-mator.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- if .Values.workloadIdentity.enabled }}
        # Tells the workload-identity webhook to project a token into this pod. Without
        # it the service account's annotation is inert and `Active Directory Default`
        # falls through to the node's identity, which has no database access.
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: {{ include "shift-o-mator.image" (dict "root" $ "repository" .Values.image.api.repository "tag" .Values.image.api.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          # Order matters: on a key present in both, the *later* source wins. The secret is
          # second deliberately, so a Key Vault value always overrides the ConfigMap's —
          # which is what makes "move the connection string into the vault" a change to
          # one values file rather than to two.
          envFrom:
            - configMapRef:
                name: shift-o-mator-api-config
            {{- if .Values.azureKeyVault.enabled }}
            - secretRef:
                name: shift-o-mator-secrets
            {{- end }}
          volumeMounts:
            {{- if .Values.azureKeyVault.enabled }}
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- if .Values.azureKeyVault.enabled }}
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: shift-o-mator-kv
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: shift-o-mator-api
  labels:
    {{- include "shift-o-mator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: http
