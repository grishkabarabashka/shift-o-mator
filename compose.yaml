# Local smoke-test only (podman-compose up / docker compose up), not a deployment
# artifact — AKS deployment is the Helm chart under deploy/helm/shift-o-mator.
#
# Needs a reachable SQL Server; there is no container for it here because the project
# targets SQL Server (LocalDB in dev), which has no official Linux image suitable for
# a throwaway container the same way Postgres/MySQL do. Point CONNECTION_STRING at a
# SQL Server instance you already have (host network, existing container, or Azure SQL).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ShiftOMator: ${CONNECTION_STRING:?set CONNECTION_STRING to a reachable SQL Server}
      Auth__Mode: Stub
      Cors__AllowedOrigins__0: http://localhost:8081
      # AI is off unless you point it somewhere. `none` is a supported state, not a broken
      # one: /api/insights/gap-summary answers 503 AI_NOT_CONFIGURED and everything else
      # works (ADR-0060). To switch it on here, the container cannot reach a Foundry Local
      # or Ollama endpoint on the host's `localhost` — use the host gateway address.
      Ai__Provider: ${AI_PROVIDER:-none}
      Ai__Endpoint: ${AI_ENDPOINT:-}
      Ai__Model: ${AI_MODEL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
    ports:
      - "5106:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:5106
    ports:
      - "8081:8080"
    depends_on:
      - api
